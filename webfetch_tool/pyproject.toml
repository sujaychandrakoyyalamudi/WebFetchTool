[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webfetch-tool"
version = "0.1.0"
description = "Production-grade LLM WebFetchTool with policy-governed fetch pipeline, browser automation, and LangChain integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # HTTP core
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "httpx>=0.25.0",
    
    # Parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "readability-lxml>=0.8.0",
    
    # Browser automation
    "playwright>=1.40.0",
    
    # PDF handling
    "pypdf>=3.17.0",
    "pdfplumber>=0.10.0",
    
    # OCR (optional)
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    
    # Security and validation
    "validators>=0.22.0",
    "tldextract>=5.1.0",
    
    # Robots.txt (use alternative)
    # robotexclusionrules>=2.0.0,
    
    # Storage and caching
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    
    # Observability
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "structlog>=23.2.0",
    
    # LangChain integration
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    
    # Utilities
    "pydantic>=2.5.0",
    "tenacity>=8.2.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/sujaychandrakoyyalamudi/WebFetchTool"
Documentation = "https://github.com/sujaychandrakoyyalamudi/WebFetchTool/blob/main/webfetch_tool/README.md"
Repository = "https://github.com/sujaychandrakoyyalamudi/WebFetchTool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
